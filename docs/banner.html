<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Profile banner</title>
<style>
  html,body{margin:0;padding:0;width:1280px;height:320px;overflow:hidden;background:#40318D}
  #stage{position:relative;width:1280px;height:320px;
    background:
      radial-gradient(ellipse at 50% 0%,#4b3aa3 0%,#40318D 55%,#2b2069 100%)}
  .frame{position:absolute;inset:18px;border-radius:16px;
    box-shadow:0 0 0 5px #7B71D6, inset 0 0 0 5px #7B71D6, inset 0 0 0 9px #2b2069}
  .scan{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 2px,rgba(0,0,0,0) 2px 5px);
    pointer-events:none}
  svg{position:absolute;inset:0;display:block}
</style></head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
    <!-- name -->
    <text x="190" y="168"
          font-family="Consolas,'Courier New',monospace" font-size="64" font-weight="700"
          fill="#A6A6FF" textLength="900" lengthAdjust="spacingAndGlyphs">TOBIAS WIDJESTAM</text>
    <!-- subtitle -->
    <text x="215" y="222"
          font-family="Consolas,'Courier New',monospace" font-size="26" font-weight="700"
          fill="#F0F0F0" textLength="850" lengthAdjust="spacingAndGlyphs">// STUDIO RYSSBY · BACKEND, TOOLING &amp; COMPUTING</text>
    <!-- blink cursor -->
    <rect x="1079" y="200" width="18" height="28" fill="#F0F0F0"/>
    <!-- baseline cue -->
    <rect x="190" y="252" width="900" height="3" fill="#7B71D6" opacity="0.55"/>
  </svg>
  <div class="scan"></div><div class="frame"></div>
</div>
</body></html>
